# Checks your champions once a month and posts moves and promotions to Slack.
#
# GitHub only runs workflows from .github/workflows/ at the root of a repository. Copy this file to
# .github/workflows/champion-tracker.yml in your own PRIVATE repository: the job commits
# state/state.json back, and that file holds the person ids and job titles of your champions.
# The first step stops the job, before anything is fetched or committed, if the repository is public.
#
# Before the first run:
#   1. Run `npm start -- init champions.csv` locally.
#   2. Commit the baselines with `git add -f state/state.json` (state/ is gitignored so it is never
#      committed by accident). Do not commit champions.csv; the job only needs the state.
#   3. Add the repository secrets COMPANYENRICH_API_KEY and, optionally, SLACK_WEBHOOK_URL.
#
# Assumes the app sits at the repository root. If it lives in a folder such as champion-tracker/,
# set working-directory below to that folder and point cache-dependency-path at its package-lock.json.

name: Champion tracker

on:
  schedule:
    - cron: "0 7 1 * *" # 07:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      args:
        description: "Extra flags for check, for example --dry-run or --max-credits 80"
        required: false
        default: ""

permissions:
  contents: write # lets the job commit state/state.json back

# Two runs at once would race on the state file.
concurrency:
  group: champion-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - name: Refuse to run in a public repository
        id: private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::error::This job commits state/state.json, which holds personal data about your champions. Run it only in a private repository."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Check champions
        run: npm start -- check $EXTRA_ARGS
        env:
          COMPANYENRICH_API_KEY: ${{ secrets.COMPANYENRICH_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EXTRA_ARGS: ${{ inputs.args }}

      # Runs even if the check stopped part-way: profiles already fetched were paid for, and their new
      # baselines (plus any digest that could not be delivered) must be kept for the next run.
      - name: Commit state
        if: always() && steps.private.outcome == 'success'
        run: |
          [ -f state/state.json ] || exit 0
          git add -f state/state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update champion tracker state"
          git push

      - name: Keep the digest
        if: always() && steps.private.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: champion-digest-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14 # digests name real people; keep them no longer than you need
